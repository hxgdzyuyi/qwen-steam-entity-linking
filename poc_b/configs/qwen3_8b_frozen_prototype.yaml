model:
  id: Qwen/Qwen3-8B-Base
  revision: null
  trust_remote_code: false

runtime:
  target_image: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
  expected_gpu_name: H100
  minimum_gpu_memory_gib: 70
  minimum_system_memory_gib: 100
  minimum_cpu_count: 16
  minimum_free_disk_gib: 24
  minimum_cached_free_disk_gib: 8
  minimum_publish_free_disk_gib: 8
  expected_torch_major_minor: "2.8"
  expected_cuda_major_minor: "12.8"

data:
  train_path: data/train.jsonl
  canonical_eval_path: data/eval_canonical.jsonl
  alias_eval_path: data/eval_alias.jsonl
  class_map_path: data/class_map.json
  data_manifest_path: data/data_manifest.json
  entities_path: ../common/data/steam_games.csv
  provenance_path: ../common/data/steam_games.provenance.csv
  alias_source_path: ../common/data/eval_alias.source.json
  poc_a_reference_path: ../common/baselines/poc_a_reference.json
  max_length: 256
  expected_classes: 1000
  expected_train_rows: 6000
  expected_canonical_rows: 1000
  expected_alias_cases: 184
  expected_alias_rows: 1104
  expected_prompt_styles: 6
  expected_cohorts:
    popular: 100
    latest: 900

features:
  pooling: last_non_padding
  extraction_batch_size: 32
  cache_dtype: float32

classifier:
  bottleneck_dim: 256
  temperature: 0.05
  prototype_anchor_weight: 0.01

training:
  output_root: outputs
  seed: 42
  data_seed: 42
  full_epochs: 20
  smoke_epochs: 20
  smoke_classes: 32
  batch_size: 256
  learning_rate: 0.001
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  checkpoint_epochs: [1, 3, 5, 10, 20]
  logging_steps: 1
  require_clean_git: true

evaluation:
  batch_size: 32
  canonical_threshold: 0.95
  diagnostic_top_k: 5
